<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><strong>Niptao Lead Filler</strong><button id="logout" class="link" hidden>Log out</button></header>

  <form id="login" hidden>
    <p class="muted">Log in with your Niptao admin username and password.</p>
    <label>Username <input id="username" autocomplete="username" required></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Log in</button>
    <p id="loginError" class="error"></p>
  </form>

  <section id="main" hidden>
    <div id="current" class="card" hidden>
      <div class="row"><span class="muted">Selected lead</span><span id="curRef" class="muted"></span></div>
      <div id="curName" class="big"></div>
      <div class="row"><span id="curPlate" class="plate"></span><span id="curPhone"></span></div>
      <button id="fill" class="primary">Fill this page</button>
      <p id="fillResult" class="note"></p>
      <div class="row links">
        <a href="https://echallan.parivahan.gov.in/index/accused-challan" target="_blank">Open Parivahan</a>
        <a href="https://traffic.delhipolice.gov.in/lokadalat/#/" target="_blank">Open Lok Adalat</a>
      </div>
    </div>
    <input id="search" placeholder="Search name, vehicle or mobile">
    <ul id="leads"></ul>
    <p id="listNote" class="muted"></p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
