# Render blueprint: builds the page and runs the Node server.
# Secrets (sync: false) are typed into Render's dashboard, never committed here.
services:
  - type: web
    name: niptao-challan-site
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production would otherwise skip Vite, which the build needs
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      # Main public address, used for Google (canonical links, sitemap)
      - key: SITE_URL
        value: https://www.niptao.co.in
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_MODE
        value: demo
      # Sample data until INSTANTPAY_CLIENT_ID / INSTANTPAY_CLIENT_SECRET are added
      # in Render's Environment tab; then change this to: instantpay
      - key: CHALLAN_PROVIDER
        value: mock
      # Max paid InstantPay lookups per day; raise it as real traffic grows
      - key: MAX_LIVE_LOOKUPS_PER_DAY
        value: "100"
