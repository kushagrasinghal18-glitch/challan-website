# Render blueprint: builds the page and runs the Node server.
# Secrets (sync: false) are typed into Render's dashboard, never committed here.
services:
  - type: web
    name: niptao-challan-site
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_MODE
        value: demo
      # mock until the InstantPay keys below are filled in; then set to: instantpay
      - key: CHALLAN_PROVIDER
        value: mock
      - key: INSTANTPAY_CLIENT_ID
        sync: false
      - key: INSTANTPAY_CLIENT_SECRET
        sync: false
