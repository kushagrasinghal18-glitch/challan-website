<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Upload documents | Niptao</title>
<style>
  :root { --navy: #0E1B36; --amber: #F5A623; --muted: #5B6478; --ok: #1F6B45; --err: #9B1C1C; --line: #E6E3DC; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #FAF8F4; color: var(--navy); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; }
  header { background: var(--navy); color: #fff; padding: 14px 16px; }
  header b { font-size: 20px; letter-spacing: .02em; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 4px 0 6px; }
  .muted { color: var(--muted); font-size: 14px; }
  .plate { display: inline-block; font-family: ui-monospace, Menlo, monospace; font-weight: 700; border: 2px solid var(--navy); border-radius: 6px; padding: 1px 8px; background: #fff; }
  .doc { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .doc.done { background: #F1F9F4; border-color: #CFE6D7; }
  .doc .nm { font-weight: 700; }
  .doc .st { font-size: 13px; color: var(--muted); }
  .doc.done .st { color: var(--ok); font-weight: 600; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; border: 1px solid #D6D2C9; background: #fff; color: var(--navy); white-space: nowrap; flex: none; }
  .btn.primary { background: var(--amber); border-color: var(--amber); }
  .btn.busy { opacity: .6; pointer-events: none; }
  .msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-weight: 600; }
  .msg.ok { background: #E3F2E9; color: var(--ok); }
  .msg.err { background: #FDE8E8; color: var(--err); }
  .center { text-align: center; padding: 40px 0; }
  .lang { float: right; background: none; border: 1px solid #ffffff55; color: #fff; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 14px; cursor: pointer; }
  footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
  footer a { color: #1F4FB8; }
</style>
</head>
<body>
<header><b>Niptao</b><button class="lang" id="lang" type="button" hidden></button></header>
<main id="app"><div class="center muted">Loading…</div></main>
<script>
(() => {
  const T = {
    en: {
      hi: (n) => `Hi ${n}, please upload your documents`,
      sub: 'For the challans on your vehicle', why: 'Take a clear photo of each document, or upload a PDF. Photos and PDFs up to 5 MB.',
      upload: 'Upload', another: 'Add another', uploading: 'Uploading…', optional: '(optional)',
      notYet: 'Not uploaded yet', done: (k) => `✓ Uploaded${k > 1 ? ` (${k} files)` : ''}`,
      allDone: 'Thank you! We have all your documents. Our team will check them and contact you on WhatsApp.',
      saved: (n) => `${n} uploaded. Thank you!`, privacy: 'Your documents are only seen by the Niptao team handling your case.',
      expired: 'This link has expired. Please ask Niptao on WhatsApp for a new link.', missing: 'This link is not valid. Please check it, or ask Niptao on WhatsApp for a new one.',
      errors: { file_too_large: 'That file is bigger than 5 MB. Please take a smaller photo.', file_type_not_allowed: 'Please upload a photo (JPG or PNG) or a PDF.', too_many_docs: 'Too many files. Please contact Niptao on WhatsApp.' },
      failed: 'The upload did not go through. Please check your internet and try again.', other: 'हिंदी',
    },
    hi: {
      hi: (n) => `नमस्ते ${n}, कृपया अपने दस्तावेज़ अपलोड करें`,
      sub: 'आपके वाहन के चालान के लिए', why: 'हर दस्तावेज़ की साफ़ फ़ोटो लें या PDF अपलोड करें। 5 MB तक की फ़ोटो और PDF।',
      upload: 'अपलोड करें', another: 'एक और जोड़ें', uploading: 'अपलोड हो रहा है…', optional: '(ज़रूरी नहीं)',
      notYet: 'अभी अपलोड नहीं हुआ', done: (k) => `✓ अपलोड हो गया${k > 1 ? ` (${k} फ़ाइलें)` : ''}`,
      allDone: 'धन्यवाद! आपके सभी दस्तावेज़ मिल गए हैं। हमारी टीम इन्हें जाँचकर आपसे WhatsApp पर संपर्क करेगी।',
      saved: (n) => `${n} अपलोड हो गया। धन्यवाद!`, privacy: 'आपके दस्तावेज़ सिर्फ़ आपका केस देख रही Niptao टीम ही देखती है।',
      expired: 'यह लिंक समाप्त हो गया है। कृपया WhatsApp पर Niptao से नया लिंक माँगें।', missing: 'यह लिंक सही नहीं है। कृपया WhatsApp पर Niptao से नया लिंक माँगें।',
      errors: { file_too_large: 'यह फ़ाइल 5 MB से बड़ी है। कृपया छोटी फ़ोटो लें।', file_type_not_allowed: 'कृपया फ़ोटो (JPG या PNG) या PDF अपलोड करें।', too_many_docs: 'बहुत ज़्यादा फ़ाइलें। कृपया WhatsApp पर Niptao से संपर्क करें।' },
      failed: 'अपलोड नहीं हुआ। कृपया इंटरनेट जाँचें और फिर कोशिश करें।', other: 'English',
    },
  };
  const token = location.pathname.split('/').filter(Boolean)[1] || '';
  const api = `/api/upload/${encodeURIComponent(token)}`;
  const app = document.getElementById('app'), langBtn = document.getElementById('lang');
  let data = null, lang = 'en', busy = '', msg = null;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Phone photos are often several MB; shrink big ones to at most 2000px before sending.
  function shrink(file) {
    // Other image kinds (like iPhone HEIC) are turned into JPEG when the browser can read them.
    const plain = /^image\/(jpeg|png|webp)$/.test(file.type);
    if (!/^image\//.test(file.type) || (plain && file.size < 1200000)) return Promise.resolve(file);
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 2000 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        c.toBlob((b) => resolve(b && (!plain || b.size < file.size) ? new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.85);
      };
      img.onerror = () => resolve(file);
      img.src = URL.createObjectURL(file);
    });
  }

  function render() {
    const t = T[lang];
    langBtn.hidden = !data; langBtn.textContent = t.other;
    if (!data) return;
    const need = data.docs.filter((d) => d.required);
    const complete = need.length > 0 && need.every((d) => d.uploaded > 0);
    app.innerHTML = `
      <h1>${esc(t.hi(data.name))}</h1>
      <div class="muted">${esc(t.sub)} ${data.plate ? `<span class="plate">${esc(data.plate)}</span>` : ''}</div>
      <p class="muted">${esc(t.why)}</p>
      ${data.docs.map((d) => `
        <div class="doc${d.uploaded ? ' done' : ''}">
          <div><div class="nm">${esc(d.name)} ${d.required ? '' : `<span class="muted">${esc(t.optional)}</span>`}</div>
            <div class="st">${esc(d.uploaded ? t.done(d.uploaded) : t.notYet)}</div></div>
          <label class="btn${d.uploaded ? '' : ' primary'}${busy ? ' busy' : ''}">${esc(busy === d.id ? t.uploading : d.uploaded ? t.another : t.upload)}
            <input type="file" accept="image/*,application/pdf" data-type="${esc(d.id)}" hidden ${busy ? 'disabled' : ''}></label>
        </div>`).join('')}
      ${complete ? `<div class="msg ok">${esc(t.allDone)}</div>` : msg ? `<div class="msg ${msg.ok ? 'ok' : 'err'}" role="status">${esc(msg.text)}</div>` : ''}
      <footer>🔒 ${esc(t.privacy)} <a href="/privacy.html">Privacy policy</a></footer>`;
  }

  app.addEventListener('change', async (e) => {
    const input = e.target.closest('input[type=file]');
    if (!input || !input.files.length) return;
    const type = input.dataset.type, files = [...input.files], t = T[lang];
    const doc = data.docs.find((d) => d.id === type);
    busy = type; msg = null; render();
    try {
      for (const f of files) {
        const file = await shrink(f);
        const res = await fetch(`${api}?type=${encodeURIComponent(type)}&name=${encodeURIComponent(file.name || '')}`, {
          method: 'POST', body: file, headers: { 'Content-Type': file.type || 'application/octet-stream' },
        });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) {
          const code = out.error || (res.status === 413 ? 'file_too_large' : '');
          if (code === 'link_expired' || code === 'link_not_found') return fail(code);
          msg = { ok: false, text: t.errors[code] || t.failed }; break;
        }
        doc.uploaded = out.uploaded; msg = { ok: true, text: t.saved(doc.name) };
      }
    } catch { msg = { ok: false, text: t.failed }; }
    busy = ''; render();
  });

  function fail(code) {
    const t = T[lang];
    data = null; langBtn.hidden = true;
    app.innerHTML = `<div class="center"><h1>${esc(code === 'link_expired' ? t.expired : t.missing)}</h1></div>`;
  }

  langBtn.addEventListener('click', () => { lang = lang === 'en' ? 'hi' : 'en'; document.documentElement.lang = lang; msg = null; render(); });

  fetch(api).then(async (res) => {
    const out = await res.json().catch(() => ({}));
    if (!res.ok) return fail(out.error === 'link_expired' ? 'link_expired' : 'link_not_found');
    data = out; lang = out.lang === 'hi' ? 'hi' : 'en'; document.documentElement.lang = lang; render();
  }).catch(() => { app.innerHTML = `<div class="center"><h1>${esc(T.en.failed)}</h1></div>`; });
})();
</script>
</body>
</html>
